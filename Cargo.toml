[package]
name = "lfm"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
debug = []

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
zip = "8.6.0"
flate2 = "1"
tar = "0.4.46"
fff-search = "0.10.5"
# Already in the tree via fff-search; used for the search panels' file mask.
globset = "0.4"
# `languages` turns on every bundled Tree-sitter grammar, so source files get
# syntax highlighting in the viewer instead of falling back to plain text.
# `zip` adds the archive listing, so a `.zip` previews as its first level
# instead of as hex.
tui-view = { git = "https://github.com/gintsgints/tui-view.git", features = ["languages", "zip"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
