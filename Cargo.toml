[package]
name = "lfm"
version = "0.11.0"
edition = "2024"
# Let-chains, used throughout, are stable from 1.88 in edition 2024.
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Keyboard-driven TUI file manager with a file viewer, shell panel and content search"
repository = "https://github.com/gintsgints/lfm"
homepage = "https://github.com/gintsgints/lfm"
documentation = "https://github.com/gintsgints/lfm#readme"
readme = "README.md"
keywords = ["tui", "file-manager", "ratatui", "terminal", "cli"]
categories = ["command-line-utilities", "filesystem"]
# Everything the binary does not need to build, kept out of the published crate.
exclude = [
    "/.github",
    "/.claude",
    "/docs",
    "/assets",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/REFACTOR.md",
]

[features]
debug = []

# Release binaries are for distribution, so they carry no debug symbols.
[profile.release]
strip = true

# Where `cargo binstall lfm` looks for a prebuilt binary: the archives the
# release workflow attaches, named by version and target triple.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/lfm-{ version }-{ target }{ archive-suffix }"
# Archives are flat: the binary sits at the root next to README and LICENSE.
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
zip = "8.6.0"
flate2 = "1"
tar = "0.4.46"
fff-search = "0.10.5"
# Already in the tree via fff-search; used for the search panels' file mask.
globset = "0.4"
# `languages` turns on every bundled Tree-sitter grammar, so source files get
# syntax highlighting in the viewer instead of falling back to plain text.
# `zip` adds the archive listing, so a `.zip` previews as its first level
# instead of as hex.
tui-view = { git = "https://github.com/gintsgints/tui-view.git", features = ["languages", "zip"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
# The embedded terminal panel: `tui-term` draws a vt100 screen as a ratatui
# widget, `vt100` is the parser feeding it, and `portable-pty` opens the pty the
# shell runs on. The `vt100` version must stay in step with `tui-term`'s, since
# the widget takes its `Screen` type directly.
tui-term = "0.3.4"
vt100 = "0.16.2"
portable-pty = "0.9"
