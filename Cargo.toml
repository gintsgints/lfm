[package]
name = "lfm"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
debug = []

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
zip = "8.6.0"
flate2 = "1"
tar = "0.4.46"
fff-search = "0.9.6"
tui-view = { git = "https://github.com/gintsgints/tui-view.git" }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
